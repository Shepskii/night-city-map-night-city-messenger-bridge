name: Release Module

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release module
        uses: rayners/foundry-module-actions/release@v1
        with:
          node-version: '20'
          build-command: 'npm run build:prod'
          working-directory: 'build'
          module-files: 'module.json scripts/ styles/ templates/ lang/ assets/'
          zip-name: 'module.zip'
